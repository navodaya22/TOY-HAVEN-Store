<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Haven - Checkout</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <a href="index.html" class="brand-title">
            <img src="images/logo.jpg" alt="Toy Haven Logo" style="height: 45px; display: block;">
        </a>
        <nav style="display: flex; align-items: center;">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="support.html">Support</a>
            <a href="cart.html" style="font-weight: bold; color: #059669; margin-left: 25px;">🛒 Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <h1 style="color: #0F172A;">Checkout</h1>
        
        <div style="margin-top: 20px; background-color: #FFFFFF; padding: 25px; border-radius: 8px; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
            <form id="checkoutForm">
                <h2 style="margin-bottom: 15px; font-size: 18px; color: #0F172A;">Delivery Details</h2>
                <div style="margin-bottom: 15px;">
                    <label for="fullName" style="color: #0F172A; font-weight: bold;">Full Name *</label><br>
                    <input type="text" id="fullName" placeholder="Enter your full name" style="padding: 8px; width: 100%; max-width: 400px; margin-top: 5px; border: 1px solid #64748B;" required>
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="emailAddr" style="color: #0F172A; font-weight: bold;">Email Address *</label><br>
                    <input type="email" id="emailAddr" placeholder="Enter your email" style="padding: 8px; width: 100%; max-width: 400px; margin-top: 5px; border: 1px solid #64748B;" required>
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="address" style="color: #0F172A; font-weight: bold;">Delivery Address *</label><br>
                    <textarea id="address" placeholder="Enter full address" style="padding: 8px; width: 100%; max-width: 400px; height: 80px; margin-top: 5px; border: 1px solid #64748B;" required></textarea>
                </div>

                <h3 style="margin: 20px 0 10px 0; font-size: 18px; color: #0F172A;">Payment Method</h3>
                <div style="margin-bottom: 15px; color: #334155;">
                    <label><input type="radio" name="payment" checked> Credit/Debit Card</label><br>
                    <label><input type="radio" name="payment"> Cash on Delivery</label>
                </div>

                <button type="submit" style="background: #059669; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;">Confirm & Place Order</button>
            </form>
            <p id="checkoutMessage" style="margin-top: 15px; font-weight: bold;"></p>
        </div>
    </main>

    <footer>
        <h3 style="font-size: 16px; margin-bottom: 5px;">Toy Haven</h3>
        <p style="font-size: 13px; color: #CBD5E1; margin-bottom: 15px;">Your one-stop destination for collectibles.</p>
        <p style="font-size: 14px; font-weight: bold; margin-bottom: 5px;">Quick Links</p>
        <p style="font-size: 14px;">
            <a href="index.html">Home</a> | 
            <a href="products.html">Products</a> | 
            <a href="wishlist.html">Wishlist</a> | 
            <a href="support.html">Support</a>
        </p>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
        <p style="font-size: 12px; color: #CBD5E1; text-align: center;">© 2026 Toy Haven. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
