<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Haven - Products</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <a href="index.html" class="brand-title">
            <img src="images/logo.jpg" alt="Toy Haven Logo" style="height: 45px; display: block;">
        </a>
        <nav style="display: flex; align-items: center;">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="support.html">Support</a>
            <a href="cart.html" style="font-weight: bold; color: #10B981; margin-left: 25px;">🛒 Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <div style="margin-bottom: 20px;">
            <input type="text" placeholder="Search by product name..." style="padding: 10px;">
        </div>

        <h1 style="margin-bottom: 10px;">Categories</h1>
        <div id="filters" style="margin-bottom: 20px; display: flex; gap: 10px;">
            <button type="button" onclick="displayProducts('All')" style="background-color: #10B981; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">All</button>
            <button type="button" onclick="displayProducts('Figurines')" style="background-color: #E2E8F0; color: #1E293B; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">Figurines</button>
            <button type="button" onclick="displayProducts('Diecast Cars')" style="background-color: #E2E8F0; color: #1E293B; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">Diecast Cars</button>
            <button type="button" onclick="displayProducts('Board Games')" style="background-color: #E2E8F0; color: #1E293B; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">Board Games</button>
            <button type="button" onclick="displayProducts('Toys')" style="background-color: #E2E8F0; color: #1E293B; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">Toys</button>
        </div>

        <h2>All Products</h2>
       <div id="product-container" style="display: flex; flex-wrap: wrap; gap: 20px;"></div>
    </main>

    <footer>
        <h3 style="font-size: 16px; margin-bottom: 5px;">Toy Haven</h3>
        <p style="font-size: 13px; color: #94A3B8; margin-bottom: 15px;">Your one-stop destination for collectibles.</p>
        <p style="font-size: 14px; font-weight: bold; margin-bottom: 5px;">Quick Links</p>
        <p style="font-size: 14px;">
            <a href="index.html">Home</a> | 
            <a href="products.html">Products</a> | 
            <a href="wishlist.html">Wishlist</a> | 
            <a href="support.html">Support</a>
        </p>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
        <p style="font-size: 12px; color: #94A3B8; text-align: center;">© 2026 Toy Haven. All rights reserved.</p>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
