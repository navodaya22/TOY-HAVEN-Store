<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Haven - Shopping Cart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <a href="index.html" class="brand-title">
            <img src="images/logo.jpg" alt="Toy Haven Logo" style="height: 45px; display: block;">
        </a>
        <nav style="display: flex; align-items: center;">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="support.html">Support</a>
            <a href="cart.html" style="font-weight: bold; color: #10B981; margin-left: 25px;">🛒 Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <h2 style="margin-bottom: 20px;">Shopping Cart</h2>
        
        <div style="background-color: #FFFFFF; padding: 25px; border-radius: 8px; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
            <div id="cart-items-container">
                <p>Your cart is currently empty.</p>
            </div>
            
            <div id="cart-summary-section" style="margin-top: 25px; padding-top: 15px; border-top: 2px solid #E2E8F0; display: none;">
                <p style="font-weight: bold; font-size: 18px; margin-bottom: 20px;">Final Total: $<span id="cart-total">0.00</span></p>
                <div style="display: flex; gap: 15px;">
                    <a href="checkout.html"><button type="button" style="background: #10B981; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer;">Proceed to Checkout</button></a>
                    <button type="button" id="clearCartBtn" style="background-color: #FEE2E2; color: #991B1B; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer;">Clear Cart</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <h3 style="font-size: 16px; margin-bottom: 5px;">Toy Haven</h3>
        <p style="font-size: 13px; color: #94A3B8; margin-bottom: 15px;">Your one-stop destination for collectibles.</p>
        <p style="font-size: 14px; font-weight: bold; margin-bottom: 5px;">Quick Links</p>
        <p style="font-size: 14px;">
            <a href="index.html">Home</a> | 
            <a href="products.html">Products</a> | 
            <a href="wishlist.html">Wishlist</a> | 
            <a href="support.html">Support</a>
        </p>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
        <p style="font-size: 12px; color: #94A3B8; text-align: center;">© 2026 Toy Haven. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
